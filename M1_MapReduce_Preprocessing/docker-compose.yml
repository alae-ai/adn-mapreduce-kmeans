services:
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    container_name: mr_namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    env_file: ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - ./:/project:rw
    networks:
      - hadoop

  datanode:
    image: apache/hadoop:3.4.1
    container_name: mr_datanode
    command: ["hdfs", "datanode"]
    env_file: ./hadoop.env
    volumes:
      - ./:/project:rw
    networks:
      - hadoop

  resourcemanager:
    image: apache/hadoop:3.4.1
    hostname: resourcemanager
    container_name: mr_resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    env_file: ./hadoop.env
    networks:
      - hadoop

  nodemanager:
    image: apache/hadoop:3.4.1
    container_name: mr_nodemanager
    command: ["yarn", "nodemanager"]
    env_file: ./hadoop.env
    networks:
      - hadoop

networks:
  hadoop:
    driver: bridge
